name: Feature request
description: Suggest something new or a better way
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: { label: What are you trying to do?, description: The task in your library, not the solution. }
    validations: { required: true }
  - type: textarea
    id: idea
    attributes: { label: What would help? }
  - type: input
    id: koha
    attributes: { label: Koha version you use }
